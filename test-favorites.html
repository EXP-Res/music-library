<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>收藏功能测试</title>
    <script src="js/jquery.min.js"></script>
</head>
<body>
    <h1>收藏功能测试</h1>
    
    <div id="test-results">
        <h2>测试结果</h2>
        <div id="test-output"></div>
    </div>

    <script>
        // 测试收藏功能的基本函数
        
        // 设置Cookie
        function setCookie(name, value, days) {
            var expires = "";
            if (days) {
                var date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        // 获取Cookie
        function getCookie(name) {
            var nameEQ = name + "=";
            var ca = document.cookie.split(';');
            for (var i = 0; i < ca.length; i++) {
                var c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // 获取收藏列表
        function getFavorites() {
            var favorites = getCookie('musicFavorites');
            if (favorites) {
                try {
                    return JSON.parse(favorites);
                } catch (e) {
                    return [];
                }
            }
            return [];
        }

        // 保存收藏列表到Cookie
        function saveFavorites(favorites) {
            setCookie('musicFavorites', JSON.stringify(favorites), 365);
        }

        // 测试函数
        function runTests() {
            var output = document.getElementById('test-output');
            
            // 测试1：清空收藏列表
            saveFavorites([]);
            var favorites = getFavorites();
            output.innerHTML += '<p>测试1 - 清空收藏: ' + (favorites.length === 0 ? '通过' : '失败') + '</p>';
            
            // 测试2：添加一首歌到收藏
            var testSong = {
                id: "test123",
                name: "测试歌曲",
                artist: "测试歌手",
                album: "测试专辑"
            };
            
            favorites.push(testSong);
            saveFavorites(favorites);
            
            var savedFavorites = getFavorites();
            output.innerHTML += '<p>测试2 - 添加收藏: ' + (savedFavorites.length === 1 && savedFavorites[0].name === "测试歌曲" ? '通过' : '失败') + '</p>';
            
            // 测试3：移除收藏
            var filteredFavorites = savedFavorites.filter(function(fav) {
                return fav.id !== testSong.id;
            });
            saveFavorites(filteredFavorites);
            
            var finalFavorites = getFavorites();
            output.innerHTML += '<p>测试3 - 移除收藏: ' + (finalFavorites.length === 0 ? '通过' : '失败') + '</p>';
            
            output.innerHTML += '<p><strong>所有测试完成！</strong></p>';
        }

        // 运行测试
        $(document).ready(function() {
            runTests();
        });
    </script>
</body>
</html>
