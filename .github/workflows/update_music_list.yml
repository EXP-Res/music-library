name: Update Music List
on:
  push:
    branches:
      - custom
  workflow_dispatch:
    branches:
      - custom

jobs:
  update_music_list:
    runs-on: ubuntu-latest
    # 当仓库隶属组织时，赋予流水线“写权限”以便提交变更
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: custom
        fetch-depth: 1

    - name: Disk usage (before)
      run: |
        df -h
        du -h -d 2 "$GITHUB_WORKSPACE" | sort -h | tail -n 30 || true
        du -sh ~/.cache/pip || true

    - name: Free space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        sudo apt-get clean || true
        df -h

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9

    - name: Install dependencies
      run: python -m pip install --no-cache-dir -r py/requirements.txt

    - name: Run update_music_list.py
      run: |
        python py/gen_music_list.py -i "${{ vars.ignores }}"
#        export ignores="铃声,经典老歌,苗苗,苏乔,纯音乐,其他,茗记,游戏,歌手专辑,高达,犬夜叉,死神,宫崎骏,董贞,进击的巨人,柯南,海贼王,哆啦,刀剑,倚天屠龙记,从零,高达,一念永恒,见或不见,羁绊,求婚,分飞,生日,鹿鼎记,义海豪情,东成西就,步步惊心,爸爸,那些年,东城西就,女孩,生日,张子枫,旧戏,泰坦,封神演义,Kotoko,ユナイト,哀と悲,失落之塔,半生雪,吹灭小山河,混沌,尘劫,3月9日,萱草花,大时代,爱情公寓,永别京华,红尘,粗面鱼腩,笼,吴观辰,林一,花粥"
#        python py/gen_music_list.py -i "${ignores}"

    - name: Check for changes
      id: changes
      run: |
        if git diff --name-only | grep -q "music_list_"; then
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit and push changes
      if: steps.changes.outputs.has_changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git commit -m "Update music list"
        git push
